apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace "com.sourav.bookstore"
    compileSdkVersion 34
    android.defaultConfig.vectorDrawables.useSupportLibrary = true
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.sourav.bookstore"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Both API keys live only in the gitignored local.properties (never committed); see
        // README.md for what to add there. Default to "" so a fresh checkout without them still
        // compiles -- the affected network calls just fail gracefully at runtime instead.
        buildConfigField "String", "GOOGLE_BOOKS_API_KEY", "\"${localProperties.getProperty('googleBooksApiKey', '')}\""
        buildConfigField "String", "LIBRARY_THING_API_KEY", "\"${localProperties.getProperty('libraryThingApiKey', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            // Pinned in-repo so the debug signature stays stable across machines/reinstalls,
            // instead of relying on the per-machine ~/.android/debug.keystore (which regenerates
            // on a fresh profile/Studio install and causes INSTALL_FAILED_UPDATE_INCOMPATIBLE).
            storeFile file('bookstore-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            // Robolectric needs the compiled manifest/resources to resolve app themes and
            // inflate layouts (e.g. AppCompat/Material widgets) in Activity/Fragment tests.
            includeAndroidResources = true

            // LiveLookupSmokeTest hits the real metadata APIs, so it only runs when asked for:
            // gradlew testDebugUnitTest -PliveLookup --tests '*LiveLookupSmokeTest'
            all {
                systemProperty 'liveLookup', project.hasProperty('liveLookup') ? 'true' : 'false'
                if (project.hasProperty('liveLookup')) {
                    outputs.upToDateWhen { false }
                }
            }
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.2.1'
    implementation 'androidx.navigation:navigation-ui:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation "android.arch.lifecycle:viewmodel:1.1.1"
    implementation "androidx.appcompat:appcompat:1.1.0"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.google.android.gms:play-services-vision:19.0.0'
    implementation 'org.apache.commons:commons-text:1.7'

    // Lets DB/Context-dependent logic run as fast JVM unit tests instead of requiring a device/emulator.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'androidx.test:core:1.5.0'
}
